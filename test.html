<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Розподіл Суми</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
      font-family: sans-serif;
      overflow: hidden;
    }
    .slideshow {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
      z-index: -1;
    }
    .header {
      position: fixed;
      top: 0;
      width: 100%;
      text-align: center;
      padding: 20px;
      background: rgba(0,0,0,0.5);
      z-index: 2;
    }
    .header h1 {
      font-size: 36px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      margin: 0;
    }
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: white;
      padding: 20px;
      padding-top: 100px; /* щоб форма не заходила під заголовок */
    }
    h2 {
      font-size: 32px;
      margin-bottom: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }
    .form-container {
      background: rgba(0,0,0,0.5);
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
    }
    .form-container input {
      font-size: 20px;
      padding: 10px;
      margin: 10px;
      width: 220px;
      border: none;
      border-radius: 5px;
    }
    .form-container button {
      font-size: 20px;
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      background: #3498db;
      color: white;
      cursor: pointer;
    }
    .form-container button:hover {
      background: #2980b9;
    }
    .result, .card-container {
      font-size: 24px;
      margin-top: 20px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
      display: none;
    }
    .card-container input {
      width: 300px;
    }
    #copyMessage {
      margin-top: 10px;
      color: #4CAF50; /* зелений */
      font-size: 18px;
      height: 24px; /* щоб блок не стрибав при появі тексту */
    }
  </style>
</head>
<body>

<div class="slideshow"></div>

<div class="header">
  <h1>Пивасик 🍺 🤤</h1>
</div>

<div class="content">
  <h2>Скільки з кого?</h2>

  <form class="form-container" onsubmit="calculate(); return false;">
    <input type="number" id="total" placeholder="Загальна сума" required>
    <input type="number" id="participants" placeholder="Кількість учасників" required>
    <button type="submit">Прорахувати</button>

    <div class="result" id="result"></div>

    <div class="card-container" id="cardContainer">
      <input type="text" id="card" placeholder="Номер картки">
      <button type="button" onclick="sendTelegram()">Відправити в Telegram</button>
      <div id="copyMessage"></div>
    </div>
  </form>
</div>

<script>
  const images = [
    "https://smska.biz.ua/wp-content/uploads/2025/07/beer1.jpg",
    "https://smska.biz.ua/wp-content/uploads/2025/07/beer2.jpg",
    "https://smska.biz.ua/wp-content/uploads/2025/07/beer3.jpg",
    "https://smska.biz.ua/wp-content/uploads/2025/07/beer4.jpg",
    "https://smska.biz.ua/wp-content/uploads/2025/07/beer5.jpg",
    "https://smska.biz.ua/wp-content/uploads/2025/07/beer6.jpg",
    "https://smska.biz.ua/wp-content/uploads/2025/07/beer7.jpg",
    "https://smska.biz.ua/wp-content/uploads/2025/07/beer8.jpg"
  ];

  let index = 0;
  const slideshow = document.querySelector(".slideshow");

  function changeBackground() {
    slideshow.style.backgroundImage = `url('${images[index]}')`;
    index = (index + 1) % images.length;
  }

  changeBackground();
  setInterval(changeBackground, 4000); // змінюється кожні 4 секунди

  let lastAmount = 0;

  function calculate() {
    const total = parseFloat(document.getElementById('total').value);
    const participants = parseInt(document.getElementById('participants').value);
    if (!isNaN(total) && !isNaN(participants) && participants > 0) {
      const amount = Math.ceil(total / participants);
      lastAmount = amount;
      document.getElementById('result').innerText = `Кожен платить: ${amount} грн`;
      document.getElementById('result').style.display = 'block';
      document.getElementById('cardContainer').style.display = 'block';
      document.getElementById('copyMessage').innerText = ''; // Очистити повідомлення
    } else {
      document.getElementById('result').innerText = 'Введіть коректні дані';
      document.getElementById('result').style.display = 'block';
      document.getElementById('cardContainer').style.display = 'none';
      document.getElementById('copyMessage').innerText = '';
    }
  }

  function sendTelegram() {
    const card = document.getElementById('card').value.trim();
    if (lastAmount > 0 && card !== "") {
      const message = `З кожного учасника ${lastAmount} грн. Сюди ${card}`;

      navigator.clipboard.writeText(message).then(() => {
        // Показуємо повідомлення про копіювання
        const copyMsg = document.getElementById('copyMessage');
        copyMsg.innerText = "Текст скопійовано у буфер обміну. Відкриваю Telegram...";
        
        // Відкриваємо Telegram
        window.open("https://t.me/", "_blank");

        // Прибрати повідомлення через 4 секунди
        setTimeout(() => {
          copyMsg.innerText = '';
        }, 4000);

      }).catch(err => {
        const copyMsg = document.getElementById('copyMessage');
        copyMsg.innerText = "Не вдалося скопіювати текст.";
        copyMsg.style.color = '#ff4444'; // червоний для помилки
        setTimeout(() => {
          copyMsg.innerText = '';
          copyMsg.style.color = '#4CAF50';
        }, 4000);
      });

    } else {
      const copyMsg = document.getElementById('copyMessage');
      copyMsg.innerText = "Спочатку прорахуйте суму та введіть номер картки";
      copyMsg.style.color = '#ff4444'; // червоний для помилки
      setTimeout(() => {
        copyMsg.innerText = '';
        copyMsg.style.color = '#4CAF50';
      }, 4000);
    }
  }
</script>

</body>
</html>
