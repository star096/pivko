<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прості калькулятори</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --hover-bg: #e0f0ff;
      --bg-color: #f0f6fc;
      --card-bg: #ffffff;
      --border-color: #d0e2f2;
      --shadow: 0 8px 20px rgba(0,0,0,0.06);
      --radius: 16px;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: var(--card-bg);
      padding: 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      border-radius: 0 0 var(--radius) var(--radius);
      box-shadow: var(--shadow);
    }
    header h1 { color: var(--accent-color); margin:0; }
    nav {
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    nav a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }
    nav a:hover, nav a.active { background-color: var(--hover-bg); border-color: var(--accent-color); }
    main { flex:1; width:100%; padding: 20px; }
    .page-content { max-width: 1100px; margin: auto; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding:20px; }
    footer { text-align:center; padding:1.5rem 1rem; background-color: var(--card-bg); border-top:1px solid var(--border-color); box-shadow: var(--shadow); border-radius: var(--radius) var(--radius) 0 0; }
    .share-buttons { text-align:center; margin:20px 0; }
    .share-buttons a { display:inline-block; margin:5px; padding:0.5rem 1rem; border-radius:6px; font-size:0.9rem; color:white; text-decoration:none; }
    .telegram { background-color: #0088cc; }
    .viber { background-color: #665cac; }
    .facebook { background-color: #3b5998; }
    .twitter { background-color: #1da1f2; }
    @media(max-width:768px) { nav { flex-direction: column; gap:0.25rem; } nav a { padding:0.4rem 0.8rem; } }
  </style>
</head>
<body>
  <header>
    <h1>Прості калькулятори</h1>
    <nav>
      <a href="#home" class="active">Головна</a>
      <a href="#tumba">Тумбочка</a>
      <a href="#vidpustka">Відпускні</a>
      <a href="#yo">У.О.</a>
      <a href="#banknote">Банкноти</a>
      <a href="#compare">Порівняння</a>
      <a href="#drako">Гра</a>
      <a href="#forlist">forlist</a>
      <a href="#powerbank">powerbank</a>
    </nav>
  </header>

  <main>
    <div class="page-content" id="pageContent">
      <!-- Контент буде підвантажуватись сюди -->
    </div>

    <div class="share-buttons">
      <a id="shareTelegram" class="telegram" target="_blank">Поділитись в Telegram</a>
      <a id="shareViber" class="viber" target="_blank">Поділитись у Viber</a>
      <a id="shareFacebook" class="facebook" target="_blank">Facebook</a>
      <a id="shareTwitter" class="twitter" target="_blank">Twitter</a>
    </div>
  </main>

  <footer>&copy; 2025 Мій Сайт. Всі права захищені.</footer>

  <script>
    const pageMap = {
      home: 'https://smska.biz.ua/calc/home.html',
      tumba: 'https://smska.biz.ua/calc/pages/tumba.html',
      vidpustka: 'https://smska.biz.ua/calc/pages/vidpustka.html',
      yo: 'https://smska.biz.ua/calc/pages/yo.html',
      banknote: 'https://smska.biz.ua/calc/pages/banknote.html',
      compare: 'https://smska.biz.ua/calc/pages/compare.html',
      drako: 'https://smska.biz.ua/calc/pages/drako.html',
      forlist: 'https://smska.biz.ua/calc/pages/forlist.html',
      powerbank: 'https://smska.biz.ua/calc/pages/powerbank.html'
    };

    async function loadPageFromHash() {
      const hash = window.location.hash.replace('#','') || 'home';
      const url = pageMap[hash] || 'https://smska.biz.ua/calc/pages/404.html';

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('404');
        const html = await res.text();
        document.getElementById('pageContent').innerHTML = html;
      } catch(e) {
        document.getElementById('pageContent').innerHTML = '<h2>Сторінку не знайдено</h2>';
      }

      // Обробка активного посилання
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      const activeLink = document.querySelector(`nav a[href="#${hash}"]`);
      if(activeLink) activeLink.classList.add('active');

      // Шеринг
      const fullUrl = window.location.origin + '/calc.html#' + hash;
      document.getElementById('shareTelegram').href = `https://t.me/share/url?url=${encodeURIComponent(fullUrl)}`;
      document.getElementById('shareViber').href = `viber://forward?text=${encodeURIComponent(fullUrl)}`;
      document.getElementById('shareFacebook').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(fullUrl)}`;
      document.getElementById('shareTwitter').href = `https://twitter.com/intent/tweet?url=${encodeURIComponent(fullUrl)}`;
    }

    window.addEventListener('hashchange', loadPageFromHash);
    window.addEventListener('DOMContentLoaded', loadPageFromHash);
  </script>
</body>
</html>
