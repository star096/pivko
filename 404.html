<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Сторінку не знайдено</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --accent-color: #3498db;
      --hover-bg: #e0f0ff;
      --bg-color: #f0f6fc;
      --card-bg: #ffffff;
      --border-color: #d0e2f2;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      --radius: 16px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-color);
      display: flex;
      justify-content: center;
      align-items: center;
      /* height: 100vh; */
      margin: 0;
      padding: 1rem;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 30px;
      max-width: 500px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 4rem;
      color: var(--accent-color);
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      text-decoration: none;
      color: white;
      background-color: var(--accent-color);
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    a:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Сторінку не знайдено. Перевірте адресу або поверніться на головну.</p>
    <a href="/calc">На головну</a>
  </div>
</body>
</html>
